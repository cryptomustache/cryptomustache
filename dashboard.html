<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoMustache — Track Record</title>
<style>
  :root{
    --ink:#11140f; --paper:#e8e4d8; --paper-2:#dfdac9; --line:#2a2e22;
    --win:#3a6b35; --loss:#9c3b2e; --accent:#c8742d; --muted:#5c5e52;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;
    line-height:1.5;padding:clamp(16px,4vw,48px);max-width:920px;margin:0 auto;}
  .masthead{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:6px;}
  .masthead h1{font-size:clamp(28px,7vw,52px);font-weight:700;letter-spacing:-1px;
    font-family:Georgia,"Times New Roman",serif;}
  .masthead .sub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-top:8px;}
  .ledger{border:2px solid var(--ink);margin:28px 0;background:var(--paper-2);}
  .ledger-head{background:var(--ink);color:var(--paper);padding:8px 14px;font-size:11px;
    letter-spacing:3px;text-transform:uppercase;}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .metric{padding:20px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .metric .label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .metric .value{font-family:Georgia,serif;font-size:clamp(26px,6vw,40px);font-weight:700;
    margin-top:6px;font-variant-numeric:tabular-nums;}
  .metric .value.pos{color:var(--win)} .metric .value.neg{color:var(--loss)}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
  th{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:var(--paper)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:1px}
  .tag.WIN{background:var(--win);color:var(--paper)} .tag.LOSS{background:var(--loss);color:var(--paper)}
  .pnl.pos{color:var(--win);font-weight:700} .pnl.neg{color:var(--loss);font-weight:700}
  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty strong{display:block;font-family:Georgia,serif;font-size:22px;color:var(--ink);margin-bottom:8px}
  .disclaimer{border-left:4px solid var(--accent);background:var(--paper-2);padding:16px 18px;
    font-size:12px;color:var(--muted);margin-top:28px;line-height:1.6;}
  .disclaimer b{color:var(--ink);text-transform:uppercase;letter-spacing:1px;font-size:11px}
  footer{margin-top:24px;font-size:11px;color:var(--muted);letter-spacing:1px}
  a{color:var(--accent)}
</style>
</head>
<body>
  <div class="masthead">
    <h1>CryptoMustache</h1>
    <div class="sub">
      <span>Track Record — Sinais BTC/USDT</span>
      <span id="updated">—</span>
    </div>
  </div>
  <div class="ledger">
    <div class="ledger-head">Desempenho · desde <span id="start">—</span></div>
    <div class="metrics" id="metrics"></div>
  </div>
  <div class="ledger">
    <div class="ledger-head">Sinais fechados (recentes)</div>
    <div id="trades-wrap"></div>
  </div>
  <div class="disclaimer" id="disclaimer"></div>
  <footer>Dados atualizados automaticamente · Binance BTCUSDT 1h · <a href="/">voltar</a></footer>
<script>
async function load(){
  let s;
  try{
    const r = await fetch('stats.json?_=' + Date.now());
    if(!r.ok) throw new Error('no stats');
    s = await r.json();
  }catch(e){
    document.getElementById('metrics').innerHTML =
      '<div class="empty"><strong>Sem dados ainda</strong>O track record aparece aqui assim que os primeiros sinais fecharem.</div>';
    return;
  }
  document.getElementById('updated').textContent = s.last_updated || '—';
  document.getElementById('start').textContent = s.track_record_start || '—';
  document.getElementById('disclaimer').innerHTML = '<b>Aviso</b><br>' + (s.disclaimer || '');
  const sum = s.summary || {};
  const closed = sum.closed_signals || 0;
  if(closed === 0){
    document.getElementById('metrics').innerHTML =
      '<div class="empty"><strong>Track record a começar</strong>' +
      (sum.open_signals||0) + ' sinal(is) em aberto. As métricas aparecem quando o primeiro fechar. ' +
      'Preferimos mostrar pouco e verdadeiro a muito e inventado.</div>';
  }else{
    const ret = sum.total_return || 0, avg = sum.avg_pnl || 0;
    const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
    const sign = v => (v>0?'+':'') + v;
    document.getElementById('metrics').innerHTML = [
      ['Win rate', (sum.win_rate||0) + '%', ''],
      ['Sinais fechados', closed, ''],
      ['Em aberto', sum.open_signals||0, ''],
      ['Retorno médio/sinal', sign(avg) + '%', cls(avg)],
      ['Retorno acumulado', sign(ret) + '%', cls(ret)]
    ].map(([l,v,c]) =>
      `<div class="metric"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`
    ).join('');
  }
  const trades = s.recent_trades || [];
  const wrap = document.getElementById('trades-wrap');
  if(!trades.length){
    wrap.innerHTML = '<div class="empty">Nenhum sinal fechado ainda.</div>';
  }else{
    wrap.innerHTML =
      '<table><thead><tr><th>Data</th><th>Ação</th><th class="num">Entrada</th>' +
      '<th class="num">Saída</th><th class="num">P&L</th><th>Resultado</th></tr></thead><tbody>' +
      trades.map(t => {
        const c = t.pnl > 0 ? 'pos' : (t.pnl < 0 ? 'neg' : '');
        const sign = t.pnl > 0 ? '+' : '';
        return `<tr><td>${t.date}</td><td>${t.action}</td>
          <td class="num">$${Number(t.entry).toLocaleString()}</td>
          <td class="num">$${Number(t.exit).toLocaleString()}</td>
          <td class="num pnl ${c}">${sign}${t.pnl}%</td>
          <td><span class="tag ${t.result}">${t.result}</span></td></tr>`;
      }).join('') + '</tbody></table>';
  }
}
load();
</script>
</body>
</html>
