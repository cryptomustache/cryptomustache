<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoMustache — Track Record</title>
<style>
  :root{
    --gold:#f5a623; --gold-hi:#ffc107; --bg1:#0a0a0a; --bg2:#1a1a2e;
    --panel:rgba(26,26,46,0.9); --text:#fff; --muted:#aaa;
    --win:#3ecf8e; --loss:#ff5c5c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 100%);color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;min-height:100vh;
    padding:clamp(16px,4vw,48px);max-width:960px;margin:0 auto;}
  .top{text-align:center;margin-bottom:8px}
  .hat{font-size:42px}
  h1{font-size:clamp(30px,7vw,52px);font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,#fff,#f5a623);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .tagline{color:var(--muted);font-size:14px;margin-top:4px}
  .nav{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:22px 0;
    padding-bottom:18px;border-bottom:1px solid rgba(245,166,35,0.2)}
  .nav a{color:var(--gold);text-decoration:none;font-size:14px}
  .nav a:hover{color:var(--gold-hi)}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:24px 0}
  .metric{background:rgba(245,166,35,0.1);border:2px solid rgba(245,166,35,0.3);
    border-radius:12px;padding:22px 16px;text-align:center}
  .metric .value{font-size:clamp(26px,5vw,38px);font-weight:800;color:var(--gold);
    font-variant-numeric:tabular-nums}
  .metric .value.pos{color:var(--win)} .metric .value.neg{color:var(--loss)}
  .metric .label{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:1px}
  .panel{background:var(--panel);border-left:5px solid var(--gold);border-radius:10px;
    padding:22px;margin:22px 0}
  .panel h2{color:var(--gold);font-size:18px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 12px;text-align:left;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.08)}
  th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700}
  .tag.WIN{background:rgba(62,207,142,0.15);color:var(--win)}
  .tag.LOSS{background:rgba(255,92,92,0.15);color:var(--loss)}
  .pnl.pos{color:var(--win);font-weight:700} .pnl.neg{color:var(--loss);font-weight:700}
  .empty{text-align:center;padding:36px 16px;color:var(--muted)}
  .empty strong{display:block;font-size:22px;color:var(--text);margin-bottom:10px}
  .disclaimer{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.25);
    border-radius:10px;padding:16px 18px;font-size:12px;color:var(--muted);margin-top:24px;line-height:1.6}
  .disclaimer b{color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-size:11px;display:block;margin-bottom:6px}
  footer{text-align:center;margin-top:24px;font-size:12px;color:#666}
</style>
</head>
<body>
  <div class="top">
    <div class="hat">🎩</div>
    <h1>CryptoMustache</h1>
    <div class="tagline">Public Performance — BTC/USDT Algorithmic Signals</div>
  </div>
  <div class="nav">
    <a href="/">← Home</a>
    <a href="/news/">News</a>
    <a href="https://t.me/CryptoMustache">Telegram</a>
    <a href="https://nowpayments.io/payment/?iid=4381861774">👑 Go Premium</a>
  </div>

  <div class="panel">
    <h2>Performance · since <span id="start">—</span></h2>
    <div class="metrics" id="metrics"></div>
  </div>

  <div class="panel">
    <h2>Closed signals (recent)</h2>
    <div id="trades-wrap"></div>
  </div>

  <div class="disclaimer" id="disclaimer"></div>
  <footer>Updated automatically · Binance BTCUSDT 1h · Last update: <span id="updated">—</span></footer>

<script>
async function load(){
  let s;
  try{
    const r = await fetch('stats.json?_=' + Date.now());
    if(!r.ok) throw 0;
    s = await r.json();
  }catch(e){
    document.getElementById('metrics').innerHTML =
      '<div class="empty"><strong>No data yet</strong>The track record appears here once the first signals close.</div>';
    return;
  }
  document.getElementById('updated').textContent = s.last_updated || '—';
  document.getElementById('start').textContent = s.track_record_start || '—';
  document.getElementById('disclaimer').innerHTML = '<b>Disclaimer</b>' + (s.disclaimer || '');
  const sum = s.summary || {};
  const closed = sum.closed_signals || 0;
  if(closed === 0){
    document.getElementById('metrics').innerHTML =
      '<div class="empty"><strong>Track record starting</strong>' +
      (sum.open_signals||0) + ' signal(s) open. Metrics appear when the first one closes. ' +
      'We prefer showing little and true over much and invented.</div>';
  }else{
    const ret=sum.total_return||0, avg=sum.avg_pnl||0;
    const cls=v=>v>0?'pos':(v<0?'neg':''); const sign=v=>(v>0?'+':'')+v;
    document.getElementById('metrics').innerHTML = [
      ['Win rate',(sum.win_rate||0)+'%',''],
      ['Closed signals',closed,''],
      ['Open',sum.open_signals||0,''],
      ['Avg return/signal',sign(avg)+'%',cls(avg)],
      ['Total return',sign(ret)+'%',cls(ret)]
    ].map(([l,v,c])=>`<div class="metric"><div class="value ${c}">${v}</div><div class="label">${l}</div></div>`).join('');
  }
  const trades=s.recent_trades||[];
  const wrap=document.getElementById('trades-wrap');
  if(!trades.length){
    wrap.innerHTML='<div class="empty">No closed signals yet.</div>';
  }else{
    wrap.innerHTML='<table><thead><tr><th>Date</th><th>Action</th><th class="num">Entry</th>'+
      '<th class="num">Exit</th><th class="num">P&L</th><th>Result</th></tr></thead><tbody>'+
      trades.map(t=>{const c=t.pnl>0?'pos':(t.pnl<0?'neg':'');const sg=t.pnl>0?'+':'';
        return `<tr><td>${t.date}</td><td>${t.action}</td>
          <td class="num">$${Number(t.entry).toLocaleString()}</td>
          <td class="num">$${Number(t.exit).toLocaleString()}</td>
          <td class="num pnl ${c}">${sg}${t.pnl}%</td>
          <td><span class="tag ${t.result}">${t.result}</span></td></tr>`;}).join('')+'</tbody></table>';
  }
}
load();
</script>
</body>
</html>
